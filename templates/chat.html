<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedChat - AI Medical Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Header */
        .chat-header {
            padding: 24px 30px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .bot-avatar {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 8px 24px rgba(99, 102, 241, 0.5); }
        }

        .bot-info h1 {
            color: white;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .bot-info .status {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            gap: 12px;
        }

        .header-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transform: translateY(-2px);
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        /* Welcome Message */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .welcome-message i {
            font-size: 48px;
            color: #8b5cf6;
            margin-bottom: 16px;
        }

        .welcome-message h2 {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .welcome-message p {
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Message Bubbles */
        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .message-content {
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.bot .message-content {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.9);
            border-bottom-left-radius: 4px;
            word-wrap: break-word;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        /* Markdown styling for bot messages */
        .message.bot .message-content h1,
        .message.bot .message-content h2,
        .message.bot .message-content h3 {
            color: rgba(255, 255, 255, 0.95);
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .message.bot .message-content h1 {
            font-size: 1.3em;
        }

        .message.bot .message-content strong,
        .message.bot .message-content b {
            color: rgba(139, 92, 246, 0.9);
            font-weight: 600;
        }

        .message.bot .message-content ol,
        .message.bot .message-content ul {
            margin-left: 20px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .message.bot .message-content li {
            margin-bottom: 6px;
            line-height: 1.6;
        }

        .message.bot .message-content p {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .message.bot .message-content code {
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'Courier New', monospace;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 6px;
            display: block;
        }

        .message.user .message-time {
            text-align: right;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 12px;
            max-width: 80%;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dots {
            background: rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* Input Area */
        .input-container {
            padding: 20px 24px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 8px 8px 8px 20px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 1rem;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .quick-action {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-action:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
            
            body {
                padding: 0;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="bot-avatar">
                <i class="fas fa-stethoscope"></i>
            </div>
            <div class="bot-info">
                <h1>MedChat AI</h1>
                <div class="status">
                    <span class="status-dot"></span>
                    <span>Online • Powered by Groq</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="clearBtn" title="Clear Chat">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="welcome-message" id="welcomeMessage">
                <i class="fas fa-heartbeat"></i>
                <h2>Welcome to MedChat!</h2>
                <p>I'm your AI-powered medical assistant. Ask me anything about<br>symptoms, conditions, treatments, or general health advice.</p>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="message-avatar" style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white;">
                <i class="fas fa-robot"></i>
            </div>
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="input-container">
            <form id="messageForm" class="input-wrapper">
                <input type="text" id="messageInput" name="msg" placeholder="Ask a medical question..." autocomplete="off" required>
                <button type="submit" class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
            <div class="quick-actions">
                <span class="quick-action" data-msg="What are the symptoms of flu?">Flu Symptoms</span>
                <span class="quick-action" data-msg="How to prevent diabetes?">Diabetes Prevention</span>
                <span class="quick-action" data-msg="What causes headaches?">Headache Causes</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        $(document).ready(function() {
            const $messagesContainer = $('#messagesContainer');
            const $typingIndicator = $('#typingIndicator');
            const $welcomeMessage = $('#welcomeMessage');
            const $sendBtn = $('#sendBtn');

            function getTime() {
                const now = new Date();
                return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            function scrollToBottom() {
                $messagesContainer.animate({ 
                    scrollTop: $messagesContainer[0].scrollHeight 
                }, 300);
            }

            function addMessage(content, isUser) {
                $welcomeMessage.hide();
                
                // Render markdown for bot messages
                let displayContent = content;
                if (!isUser) {
                    displayContent = marked.parse(content);
                } else {
                    // Escape HTML for user messages to prevent injection
                    displayContent = $('<div>').text(content).html();
                }
                
                const messageHtml = `
                    <div class="message ${isUser ? 'user' : 'bot'}">
                        <div class="message-avatar">
                            <i class="fas ${isUser ? 'fa-user' : 'fa-robot'}"></i>
                        </div>
                        <div>
                            <div class="message-content">${displayContent}</div>
                            <span class="message-time">${getTime()}</span>
                        </div>
                    </div>
                `;
                
                $messagesContainer.append(messageHtml);
                scrollToBottom();
            }

            function showTyping() {
                $typingIndicator.addClass('active');
                $messagesContainer.append($typingIndicator);
                scrollToBottom();
            }

            function hideTyping() {
                $typingIndicator.removeClass('active');
            }

            $('#messageForm').on('submit', function(e) {
                e.preventDefault();
                
                const message = $('#messageInput').val().trim();
                if (!message) return;

                addMessage(message, true);
                $('#messageInput').val('');
                $sendBtn.prop('disabled', true);
                
                showTyping();

                $.ajax({
                    url: '/get',
                    type: 'POST',
                    data: { msg: message },
                    success: function(response) {
                        hideTyping();
                        addMessage(response, false);
                        $sendBtn.prop('disabled', false);
                    },
                    error: function() {
                        hideTyping();
                        addMessage('Sorry, something went wrong. Please try again.', false);
                        $sendBtn.prop('disabled', false);
                    }
                });
            });

            // Quick actions
            $('.quick-action').on('click', function() {
                const msg = $(this).data('msg');
                $('#messageInput').val(msg);
                $('#messageForm').submit();
            });

            // Clear chat
            $('#clearBtn').on('click', function() {
                $.post('/clear', function() {
                    $messagesContainer.html(`
                        <div class="welcome-message" id="welcomeMessage">
                            <i class="fas fa-heartbeat"></i>
                            <h2>Welcome to MedChat!</h2>
                            <p>I'm your AI-powered medical assistant. Ask me anything about<br>symptoms, conditions, treatments, or general health advice.</p>
                        </div>
                    `);
                });
            });
        });
    </script>
</body>
</html>
